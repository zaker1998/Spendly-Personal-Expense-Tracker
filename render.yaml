# Render blueprint for the public demo.
#
# The database lives on Neon rather than Render: Render's free Postgres expires
# after a fixed window and is then deleted, which is fine for a scratch project
# and not fine for a demo link on a CV. Neon's free tier does not expire, so
# DATABASE_URL is supplied by hand instead of by a `databases:` block here.

services:
  - type: web
    name: spendly
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      # Neon connection string, set in the Render dashboard (never committed).
      # Format: postgresql://user:password@ep-xxx.<region>.aws.neon.tech/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Groq key (set in Render dashboard). Without it, suggest uses heuristic.
      - key: AI_API_KEY
        sync: false
      # Render terminates TLS and rewrites X-Forwarded-For, so the header can be
      # trusted here. It must stay off anywhere the app is reachable directly.
      - key: RATE_LIMIT_BEHIND_PROXY
        value: "true"
      # This is the public demo: the README publishes these credentials on
      # purpose so recruiters can log in without registering.
      - key: SEED_DEMO_DATA
        value: "true"
