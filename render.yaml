# Render Blueprint — one-click deploy
# https://render.com/docs/blueprint-spec
#
# Dashboard → Blueprints → New → select this repo.
# Demo logins: demo@spendly.app / Demo123!  |  admin@spendly.app / Admin123!

databases:
  - name: spendly-db
    plan: free
    databaseName: spendly
    user: spendly

services:
  - type: web
    name: spendly
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: spendly-db
          property: connectionString
