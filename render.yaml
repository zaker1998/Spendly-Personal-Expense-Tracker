databases:
  - name: spendly-db
    plan: free
    databaseName: spendly
    user: spendly

services:
  - type: web
    name: spendly
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: spendly-db
          property: connectionString
      # Groq key (set in Render dashboard). Without it, suggest uses heuristic.
      - key: AI_API_KEY
        sync: false
