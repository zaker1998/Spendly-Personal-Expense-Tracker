databases:
  - name: spendly-db
    plan: free
    databaseName: spendly
    user: spendly

services:
  - type: web
    name: spendly
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: spendly-db
          property: connectionString
      # Groq key (set in Render dashboard). Without it, suggest uses heuristic.
      - key: AI_API_KEY
        sync: false
      # Render terminates TLS and rewrites X-Forwarded-For, so the header can be
      # trusted here. It must stay off anywhere the app is reachable directly.
      - key: RATE_LIMIT_BEHIND_PROXY
        value: "true"
      # This is the public demo: the README publishes these credentials on
      # purpose so recruiters can log in without registering.
      - key: SEED_DEMO_DATA
        value: "true"
