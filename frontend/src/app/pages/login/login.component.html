<section class="auth-page">
  <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()">
    <p class="brand">Spendly</p>
    <h1>Sign in</h1>
    <p class="muted">Sign in to manage your expenses.</p>

    <label>
      Email
      <input type="email" formControlName="email" autocomplete="username" />
    </label>
    <label>
      Password
      <input type="password" formControlName="password" autocomplete="current-password" />
    </label>

    <p class="error" role="alert" *ngIf="error">{{ error }}</p>

    <!-- The demo API is on a free tier that sleeps. Saying so beats a spinner
         that looks like the app is broken. -->
    <p class="notice" role="status" *ngIf="slow">
      Waking the demo server — it sleeps when idle and can take up to a minute.
      This only happens on the first request.
    </p>

    <button type="submit" [disabled]="loading">{{ loading ? 'Signing in…' : 'Sign in' }}</button>
    <p class="footer">No account? <a routerLink="/register">Create one</a></p>
    <p class="footer">
      Just looking around?
      <button type="button" class="link" (click)="fillDemo()">Use the demo account</button>
    </p>
  </form>
</section>
