<app-auth-layout>
  <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()">
    <div class="card-head">
      <h1>Create your account</h1>
      <p class="muted">Starts with five everyday categories you can rename or recolour.</p>
    </div>

    <div class="field">
      <label class="field-label" for="register-email">Email</label>
      <input
        id="register-email"
        class="input"
        type="email"
        formControlName="email"
        autocomplete="username"
        placeholder="you@example.com"
      />
    </div>
    <div class="field">
      <label class="field-label" for="register-password">Password</label>
      <input
        id="register-password"
        class="input"
        type="password"
        formControlName="password"
        autocomplete="new-password"
        aria-describedby="register-password-hint"
      />
      <p id="register-password-hint" class="hint">At least 8 characters.</p>
    </div>

    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }

    <button type="submit" class="btn submit" [disabled]="loading()">
      {{ loading() ? 'Creating…' : 'Create account' }}
    </button>
    <p class="footer">Already registered? <a routerLink="/login">Sign in</a></p>
  </form>
</app-auth-layout>
