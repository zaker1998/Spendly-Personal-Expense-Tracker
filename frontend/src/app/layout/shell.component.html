<!-- The href keeps this a real link, but the click is handled: with
     <base href="/"> the browser resolves "#main-content" against the base and
     navigates to the root route, so a plain fragment link would throw the user
     off whatever page they were on. -->
<a class="skip-link" href="#main-content" (click)="skipToContent($event, main)"
  >Skip to main content</a
>
<div class="shell">
  <aside class="sidebar">
    <a class="brand" routerLink="/"><app-brand /></a>
    <nav aria-label="Main">
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: link.path === '/' }"
          ><app-icon [name]="link.icon" /><span>{{ link.label }}</span></a
        >
      }
      @if (auth.isAdmin()) {
        <p class="nav-section" aria-hidden="true">Administration</p>
        <a routerLink="/admin" routerLinkActive="active"
          ><app-icon name="shield" /><span>Admin</span></a
        >
      }
    </nav>
    <div class="user">
      <span class="avatar" aria-hidden="true">{{ initial() }}</span>
      <span class="who">
        <span class="visually-hidden">Signed in as </span>
        <span class="email">{{ auth.session()?.email }}</span>
        <span class="role">{{ auth.isAdmin() ? 'Administrator' : 'Personal account' }}</span>
      </span>
      <button type="button" class="logout" (click)="auth.logout()">
        <app-icon name="logout" [size]="16" /><span>Log out</span>
      </button>
    </div>
  </aside>
  <!-- tabindex="-1" so focus can be moved here; without it the browser scrolls
       but the next Tab goes back to the top of the sidebar. -->
  <main #main class="content" id="main-content" tabindex="-1">
    <router-outlet />
  </main>
</div>
<app-toasts />
