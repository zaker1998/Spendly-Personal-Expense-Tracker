spring:
  application:
    name: spendly-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/spendly}
    username: ${SPRING_DATASOURCE_USERNAME:spendly}
    password: ${SPRING_DATASOURCE_PASSWORD:spendly}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

spendly:
  ai:
    # Groq chat completions by default (path includes /openai/v1 — that is Groq's API URL).
    enabled: ${AI_SUGGESTIONS_ENABLED:true}
    api-key: ${AI_API_KEY:}
    base-url: ${AI_BASE_URL:https://api.groq.com/openai/v1}
    # llama-3.1-8b-instant was Groq's free-tier default until they shut it down
    # on 2026-08-16; gpt-oss-20b is their named replacement.
    model: ${AI_MODEL:openai/gpt-oss-20b}
    # A reasoning model by default, and reasoning tokens are billed and counted
    # like output tokens. Blank to omit the parameter entirely.
    reasoning-effort: ${AI_REASONING_EFFORT:low}
    timeout-ms: ${AI_TIMEOUT_MS:5000}
  jwt:
    secret: ${JWT_SECRET:spendly-dev-secret-key-change-me-in-production-32chars-min}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    auth-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:10}
    ai-per-minute: ${RATE_LIMIT_AI_PER_MINUTE:30}
    # Only enable where a proxy we control rewrites X-Forwarded-For, otherwise
    # the header is client-supplied and the limit is trivially bypassed.
    behind-proxy: ${RATE_LIMIT_BEHIND_PROXY:false}
  export:
    # Safety valve on the CSV export, not a product limit: the endpoint streams,
    # so the cap bounds the response rather than the server's memory.
    max-rows: ${EXPORT_MAX_ROWS:50000}
  # Creates the demo/admin accounts from the README. Public demo only.
  seed-demo-data: ${SEED_DEMO_DATA:false}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: spendly

logging:
  level:
    org.hibernate.SQL: warn
    com.spendly: info
