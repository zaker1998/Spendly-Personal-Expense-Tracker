services:
  postgres:
    image: postgres:16-alpine
    container_name: spendly-postgres
    environment:
      POSTGRES_DB: spendly
      POSTGRES_USER: spendly
      POSTGRES_PASSWORD: spendly
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spendly -d spendly"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spendly-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/spendly
      SPRING_DATASOURCE_USERNAME: spendly
      SPRING_DATASOURCE_PASSWORD: spendly
      JWT_SECRET: spendly-dev-secret-key-change-me-in-production-32chars-min
      CORS_ALLOWED_ORIGINS: http://localhost:4200,http://localhost
      # Optional Groq key; falls back to heuristic if unset
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.groq.com/openai/v1}
      AI_MODEL: ${AI_MODEL:-llama-3.1-8b-instant}
      # Local run: seed the demo accounts documented in the README.
      SEED_DEMO_DATA: "true"
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: spendly-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres-data:
