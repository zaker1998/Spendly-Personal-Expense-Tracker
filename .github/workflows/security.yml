# Supply-chain and static analysis. Deliberately separate from ci.yml: these
# jobs are slower, and a CodeQL run should not gate a one-line fix.

name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # A dependency that was clean on Monday can have a CVE by Thursday, and
    # nothing about the repository changes when that happens.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Build backend
        if: matrix.language == 'java-kotlin'
        working-directory: backend
        run: ./mvnw -B -DskipTests package

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci
      # High and critical only: the moderate advisories in a build toolchain are
      # almost all dev-time and would make this permanently red.
      - name: Audit
        working-directory: frontend
        run: npm audit --audit-level=high

  image-scan:
    name: Trivy image scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Build the deployed image
        run: docker build -t spendly:scan .

      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: spendly:scan
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy
