name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        working-directory: backend
        run: ./mvnw -B test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco
          path: backend/target/site/jacoco

      - name: Package
        working-directory: backend
        run: ./mvnw -B -DskipTests package

      - name: Build Docker image
        working-directory: backend
        run: docker build -t spendly-backend:ci .

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npm run test:ci

      - name: Build
        working-directory: frontend
        run: npm run build -- --configuration=production

      - name: Build Docker image
        working-directory: frontend
        run: docker build -t spendly-frontend:ci .

  infra:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Format check
        working-directory: infra/terraform
        run: terraform fmt -check -recursive

      # -backend=false: no state and no credentials needed just to type-check
      # the configuration.
      - name: Validate
        working-directory: infra/terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate

  a11y:
    name: Accessibility (axe-core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # The suite drives the real app, so it needs the API and the database too.
      - name: Start the stack
        run: docker compose up -d --build

      - name: Wait for the stack
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8081/actuator/health > /dev/null \
               && curl -fsS http://localhost:4200 > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "stack did not come up in time"
          docker compose logs --no-color --tail 100
          exit 1

      - name: Run accessibility tests
        working-directory: frontend
        run: npm run test:a11y

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report

      - name: Tear down
        if: always()
        run: docker compose down -v
